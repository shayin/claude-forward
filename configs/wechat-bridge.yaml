# Claude Forward 微信桥接配置
server:
  url: "https://localhost:6022"      # Claude Forward Server 地址
  token: "your-auth-token"           # 认证 Token（与 server.yaml 中的 tokens 一致）
  default_clawbot_id: ""             # 默认 clawbot_id（路由未匹配时使用）

# 路由：微信用户 ID → 电脑 clawbot_id
# 微信用户 ID 格式: wxid_xxx@im.wechat（首次运行后从日志获取）
routing: {}
  # "wxid_xxx@im.wechat": "my-macbook"
  # "wxid_yyy@im.wechat": "wife-thinkpad"
