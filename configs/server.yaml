server:
  host: "0.0.0.0"
  port: 8765
  tls:
    enabled: true
    cert_file: ""
    key_file: ""
    # 如果有域名，填写域名自动使用 Let's Encrypt
    domain: ""

auth:
  tokens:
    - "your-secret-token-here"

session:
  timeout: 300
  max_clients: 10

logging:
  enabled: true
  file: "/var/log/claude-forward/server.log"
  max_days: 7
  log_level: "info"
