<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claude Forward</title>
    <link rel="stylesheet" href="lib/xterm.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 24px;
            color: #00d4ff;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-dot.connecting {
            background: #ffaa00;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .client-list {
            margin-bottom: 20px;
        }

        .client-list h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #888;
        }

        .client-item {
            background: #16213e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .client-item:hover {
            border-color: #00d4ff;
            background: #1a2744;
        }

        .client-item.active {
            border-color: #00ff88;
            background: #1a2f1a;
        }

        .client-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .client-id {
            font-size: 12px;
            color: #666;
        }

        .terminal-container {
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .terminal-container.active {
            display: block;
        }

        #terminal {
            padding: 10px;
            height: calc(100vh - 300px);
            min-height: 400px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #16213e;
            border-top: 1px solid #333;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #00d4ff;
            color: #000;
        }

        .btn-primary:hover {
            background: #00b8e6;
        }

        .btn-danger {
            background: #ff4757;
            color: #fff;
        }

        .btn-danger:hover {
            background: #ff3344;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h2 {
            margin-bottom: 10px;
        }

        .config-form {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #888;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 4px;
            background: #1a1a2e;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
        }

        .cert-notice {
            background: #2a1f1a;
            border: 1px solid #ff6600;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .cert-notice.show {
            display: block;
        }

        .cert-notice h3 {
            color: #ff6600;
            margin-bottom: 10px;
        }

        .cert-notice p {
            font-size: 14px;
            line-height: 1.6;
        }

        .cert-notice code {
            background: #1a1a2e;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            #terminal {
                height: calc(100vh - 350px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Claude Forward</h1>
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">未连接</span>
            </div>
        </div>

        <div class="cert-notice" id="certNotice">
            <h3>证书警告</h3>
            <p>如果您看到浏览器证书警告，这是因为服务器使用了自签名证书。</p>
            <p>请点击"高级" → "继续访问"来信任此证书。</p>
        </div>

        <div class="config-form" id="configForm">
            <div class="form-group">
                <label>服务器地址</label>
                <input type="text" id="serverUrl" placeholder="wss://your-server:6022">
            </div>
            <div class="form-group">
                <label>Token</label>
                <input type="password" id="token" placeholder="your-secret-token">
            </div>
            <button class="btn btn-primary" onclick="connect()">连接</button>

            <!-- 调试面板 -->
            <div id="debugPanel" style="margin-top: 15px; padding: 10px; background: #1a1a2e; border-radius: 4px; font-size: 12px; max-height: 150px; overflow-y: auto;">
                <div style="color: #888; margin-bottom: 5px;">调试日志:</div>
                <div id="debugLog" style="color: #ff6600;"></div>
            </div>
        </div>

        <div class="client-list" id="clientList" style="display: none;">
            <h2>可用客户端</h2>
            <div id="clients"></div>
        </div>

        <div class="terminal-container" id="terminalContainer">
            <div id="terminal"></div>
            <!-- 隐藏的 input 用于触发移动端软键盘 -->
            <input type="text" id="mobileInput" style="position: absolute; left: -9999px; opacity: 0;" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <div class="toolbar">
                <button class="btn btn-primary" onclick="detach()">断开连接</button>
                <button class="btn btn-danger" onclick="killSession()">销毁会话</button>
            </div>
        </div>
    </div>

    <script src="lib/xterm.min.js"></script>
    <script src="lib/xterm-addon-web-links.min.js"></script>
    <script src="lib/xterm-addon-fit.min.js"></script>
    <script>
        let ws = null;
        let term = null;
        let fitAddon = null;
        let attachedClient = null;
        let isReconnecting = false; // 是否正在重连
        let pendingOutput = []; // 待处理的输出缓冲区（解决消息时序问题）

        // 检查 URL 参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                server: params.get('server') || localStorage.getItem('cf_server') || '',
                token: params.get('token') || localStorage.getItem('cf_token') || ''
            };
        }

        // 初始化
        function init() {
            const params = getUrlParams();
            if (params.server) {
                document.getElementById('serverUrl').value = params.server;
            }
            if (params.token) {
                document.getElementById('token').value = params.token;
            }

            // 检查是否是 HTTPS
            if (location.protocol === 'https:') {
                document.getElementById('certNotice').classList.add('show');
            }
        }

        // 连接服务器
        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;

            if (!serverUrl || !token) {
                alert('请填写服务器地址和 Token');
                return;
            }

            // 保存配置
            localStorage.setItem('cf_server', serverUrl);
            localStorage.setItem('cf_token', token);

            updateStatus('connecting', '连接中...');

            const wsUrl = `${serverUrl}/ws?token=${token}`;
            const maskedWsUrl = `${serverUrl}/ws?token=${'*'.repeat(token.length)}`;
            showDebug('正在连接: ' + maskedWsUrl);

            try {
                ws = new WebSocket(wsUrl);
            } catch (e) {
                showDebug('创建 WebSocket 失败: ' + e.message);
                return;
            }

            ws.onopen = () => {
                showDebug('WebSocket 已连接');
                updateStatus('connected', '已连接');

                // 检查是否需要恢复 attach 状态
                const savedClient = localStorage.getItem('cf_attached_client');
                if (savedClient) {
                    showDebug('恢复 attach 状态: ' + savedClient);
                    attachedClient = savedClient;
                    // 直接 attach 到之前的客户端
                    sendMessage({
                        type: 'attach',
                        payload: { client_id: savedClient }
                    });
                    isReconnecting = false;
                } else {
                    // 请求客户端列表
                    sendMessage({ type: 'list' });
                }
            };

            ws.onmessage = (event) => {
                showDebug('收到消息: ' + event.data.substring(0, 100));
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };

            ws.onclose = (event) => {
                showDebug('连接关闭: code=' + event.code + ', reason=' + event.reason);
                updateStatus('', '连接已断开');

                // 断开时清理终端 DOM，避免重连后残留显示
                if (term) {
                    term.clear();
                    document.getElementById('terminal').innerHTML = '';
                }
                pendingOutput = [];

                // 如果之前有 attach 的客户端，保存到 localStorage 以便重连后恢复
                if (attachedClient) {
                    localStorage.setItem('cf_attached_client', attachedClient);
                    isReconnecting = true;
                    showDebug('保存 attach 状态，准备重连: ' + attachedClient);

                    // 3秒后自动重连
                    setTimeout(() => {
                        if (isReconnecting) {
                            showDebug('自动重连中...');
                            connect();
                        }
                    }, 3000);
                } else {
                    document.getElementById('clientList').style.display = 'none';
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('', '连接错误');
                showDebug('WebSocket 错误: ' + wsUrl);
            };
        }

        // 显示调试信息
        function showDebug(msg) {
            const debugEl = document.getElementById('debugLog');
            if (debugEl) {
                const time = new Date().toLocaleTimeString();
                debugEl.innerHTML = `<div>[${time}] ${msg}</div>` + debugEl.innerHTML;
            }
        }

        // 处理消息
        function handleMessage(msg) {
            switch (msg.type) {
                case 'list':
                    showClients(msg.payload.clients);
                    break;
                case 'attached':
                    // 保存 attach 状态
                    localStorage.setItem('cf_attached_client', attachedClient);
                    showTerminal();
                    break;
                case 'detached':
                    // 清除 attach 状态
                    attachedClient = null;
                    isReconnecting = false;
                    localStorage.removeItem('cf_attached_client');
                    hideTerminal();
                    break;
                case 'output':
                    if (msg.payload && msg.payload.data) {
                        if (term) {
                            term.write(msg.payload.data);
                        } else {
                            // 终端还没创建，缓存输出
                            pendingOutput.push(msg.payload.data);
                        }
                    }
                    break;
                case 'error':
                    // 如果是 attach 失败，清除保存的状态
                    if (msg.payload?.message?.includes('not found')) {
                        localStorage.removeItem('cf_attached_client');
                        isReconnecting = false;
                    }
                    alert('错误: ' + (msg.payload?.message || '未知错误'));
                    break;
            }
        }

        // 显示客户端列表
        function showClients(clients) {
            const container = document.getElementById('clients');
            document.getElementById('clientList').style.display = 'block';

            if (!clients || clients.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>没有可用的客户端</h2>
                        <p>请确保本地客户端已启动并连接到服务器</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = clients.map(client => `
                <div class="client-item ${attachedClient === client.id ? 'active' : ''}" onclick="attach('${client.id}')">
                    <div class="client-name">${client.name || client.id}</div>
                    <div class="client-id">ID: ${client.id}</div>
                </div>
            `).join('');
        }

        // 附加到客户端
        function attach(clientId) {
            attachedClient = clientId;
            sendMessage({
                type: 'attach',
                payload: { client_id: clientId }
            });
        }

        // 断开连接
        function detach() {
            sendMessage({ type: 'detach' });
            attachedClient = null;
            isReconnecting = false;
            // 清除保存的 attach 状态
            localStorage.removeItem('cf_attached_client');
            hideTerminal();
        }

        // 销毁会话
        function killSession() {
            if (!confirm('确定要销毁终端会话吗？会话中的所有进程将被终止。')) {
                return;
            }
            sendMessage({ type: 'kill_session' });
            attachedClient = null;
            isReconnecting = false;
            localStorage.removeItem('cf_attached_client');
            hideTerminal();
        }

        // 显示终端
        function showTerminal() {
            document.getElementById('terminalContainer').classList.add('active');
            document.getElementById('configForm').style.display = 'none';
            document.getElementById('clientList').style.display = 'none';

            // 清空终端容器 DOM，确保没有残留
            const terminalEl = document.getElementById('terminal');
            terminalEl.innerHTML = '';

            // 初始化终端（每次重新创建以确保干净状态）
            if (term) {
                // 销毁旧终端
                term.dispose();
                term = null;
                fitAddon = null;
            }

            // 清空待处理的输出（避免旧数据干扰新终端）
            pendingOutput = [];

            term = new Terminal({
                theme: {
                    background: '#000',
                    foreground: '#fff',
                    cursor: '#00ff88'
                },
                fontSize: 14,
                fontFamily: 'Monaco, Menlo, monospace',
                cursorBlink: true
            });
            term.open(document.getElementById('terminal'));
            term.loadAddon(new WebLinksAddon.WebLinksAddon());
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            // 输入处理
            term.onData((data) => {
                sendMessage({
                    type: 'input',
                    payload: { data: data }
                });
            });

            // 移动端软键盘支持
            const mobileInput = document.getElementById('mobileInput');

            // 点击终端时聚焦 input
            term.element.addEventListener('click', () => {
                mobileInput.focus();
            });

            // 特殊键映射
            const specialKeys = {
                'Enter': '\r',
                'Backspace': '\x7f',
                'Tab': '\t',
                'Escape': '\x1b',
                'ArrowUp': '\x1b[A',
                'ArrowDown': '\x1b[B',
                'ArrowLeft': '\x1b[D',
                'ArrowRight': '\x1b[C',
                'Delete': '\x1b[3~',
                'Home': '\x1b[H',
                'End': '\x1b[F'
            };

            // 监听 keydown - 只处理特殊键
            mobileInput.addEventListener('keydown', (e) => {
                if (specialKeys[e.key]) {
                    e.preventDefault();
                    sendMessage({
                        type: 'input',
                        payload: { data: specialKeys[e.key] }
                    });
                }
            });

            // 监听 input 事件处理普通字符输入
            mobileInput.addEventListener('input', (e) => {
                if (e.data) {
                    sendMessage({
                        type: 'input',
                        payload: { data: e.data }
                    });
                }
                mobileInput.value = '';
            });

            // 窗口大小变化
            window.addEventListener('resize', () => {
                fitTerminal();
            });

            // 处理缓存的输出（解决 output 消息先于 attached 消息到达的时序问题）
            if (pendingOutput.length > 0) {
                pendingOutput.forEach(data => term.write(data));
                pendingOutput = [];
            }

            setTimeout(fitTerminal, 100);
        }

        // 隐藏终端
        function hideTerminal() {
            document.getElementById('terminalContainer').classList.remove('active');
            document.getElementById('configForm').style.display = 'block';
            document.getElementById('clientList').style.display = 'block';
            if (term) {
                term.clear();
                // 清空终端 DOM，避免残留
                document.getElementById('terminal').innerHTML = '';
            }
            // 清空待处理的输出
            pendingOutput = [];
        }

        // 调整终端大小
        function fitTerminal() {
            if (term && fitAddon) {
                try {
                    fitAddon.fit();
                    sendMessage({
                        type: 'resize',
                        payload: {
                            cols: term.cols,
                            rows: term.rows
                        }
                    });
                } catch (e) {
                    console.error('Fit error:', e);
                }
            }
        }

        // 发送消息
        function sendMessage(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        // 更新状态
        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            dot.className = 'status-dot';
            if (status) {
                dot.classList.add(status);
            }
            statusText.textContent = text;
        }

        // 初始化
        init();
    </script>
</body>
</html>
