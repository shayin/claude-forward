<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Claude Forward</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #1a1a2e;
            --surface: #16213e;
            --border: #333;
            --text: #eee;
            --muted: #888;
            --accent: #00d4ff;
            --green: #00ff88;
            --danger: #ff4757;
            --user-bg: #0d47a1;
            --assistant-bg: #263238;
            --tool-bg: #1b2a1b;
            --thinking-bg: #2a2a1b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* === Header === */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header h1 {
            font-size: 16px;
            color: var(--accent);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
            flex-shrink: 0;
        }

        .status-dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .status-dot.connecting { background: #ffaa00; animation: pulse 1s infinite; }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .status-text { font-size: 12px; color: var(--muted); }

        .header-actions { display: flex; gap: 8px; }

        .btn-icon {
            background: none;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-icon:hover { border-color: var(--accent); }
        .btn-icon.danger { border-color: var(--danger); color: var(--danger); }

        /* === Connection Form === */
        .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
        .view.active { display: flex; }

        #connectionView {
            padding: 20px 16px;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--muted);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus { outline: none; border-color: var(--accent); }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary:hover { opacity: 0.9; }

        /* === Client List === */
        .client-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .client-item:hover { border-color: var(--accent); }
        .client-item:active { transform: scale(0.98); }

        .client-name { font-weight: 600; font-size: 15px; }
        .client-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .client-path {
            font-size: 11px; color: #555; margin-top: 2px;
            font-family: Monaco, Menlo, monospace;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .empty-state {
            text-align: center; padding: 60px 20px; color: #666;
        }

        /* === Chat View === */
        #chatView {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        #chatView.active { display: flex; }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }

        /* Chat bubbles */
        .message {
            margin-bottom: 12px;
            max-width: 90%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

        .message.user {
            margin-left: auto;
        }

        .message.assistant, .message.tool, .message.thinking {
            margin-right: auto;
        }

        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.user .bubble {
            background: var(--user-bg);
            border-bottom-right-radius: 4px;
            color: #fff;
        }

        .message.assistant .bubble {
            background: var(--assistant-bg);
            border-bottom-left-radius: 4px;
        }

        .message.thinking .bubble {
            background: var(--thinking-bg);
            color: var(--muted);
            font-style: italic;
            font-size: 13px;
            border-bottom-left-radius: 4px;
        }

        /* Markdown content */
        .bubble p { margin-bottom: 8px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble code {
            background: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Monaco, Menlo, monospace;
            font-size: 13px;
        }
        .bubble pre {
            background: #000;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble pre code {
            background: none;
            padding: 0;
            font-size: 12px;
            line-height: 1.5;
        }
        .bubble ul, .bubble ol { padding-left: 20px; margin: 8px 0; }
        .bubble li { margin: 4px 0; }
        .bubble h1,.bubble h2,.bubble h3,.bubble h4 { margin: 12px 0 6px; }
        .bubble a { color: var(--accent); }
        .bubble blockquote {
            border-left: 3px solid var(--accent);
            padding-left: 12px;
            margin: 8px 0;
            color: var(--muted);
        }

        /* Tool call cards */
        .tool-card {
            background: var(--tool-bg);
            border: 1px solid #2d4a2d;
            border-radius: 10px;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            user-select: none;
        }

        .tool-header:hover { background: rgba(255,255,255,0.05); }

        .tool-icon { font-size: 14px; }
        .tool-name { font-weight: 600; color: var(--green); }
        .tool-args {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--muted);
            font-family: Monaco, Menlo, monospace;
            font-size: 11px;
        }
        .tool-toggle { color: var(--muted); font-size: 10px; transition: transform 0.2s; }
        .tool-toggle.open { transform: rotate(90deg); }

        .tool-output {
            display: none;
            padding: 8px 12px;
            border-top: 1px solid #2d4a2d;
            max-height: 300px;
            overflow-y: auto;
        }

        .tool-output.open { display: block; }

        .tool-output pre {
            margin: 0;
            font-family: Monaco, Menlo, monospace;
            font-size: 11px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-all;
            color: #aaa;
        }

        /* Streaming indicator */
        .streaming-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            color: var(--muted);
            font-size: 13px;
        }

        .streaming-dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            animation: dotBounce 1.4s infinite ease-in-out both;
        }

        .streaming-dots span:nth-child(1) { animation-delay: -0.32s; }
        .streaming-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes dotBounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }

        /* === Input Bar === */
        .input-bar {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 16px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .input-bar textarea {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            min-height: 40px;
            line-height: 1.4;
            outline: none;
        }

        .input-bar textarea:focus { border-color: var(--accent); }

        .input-bar textarea::placeholder { color: #555; }

        .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: #000;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-send:hover { opacity: 0.9; transform: scale(1.05); }
        .btn-send:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* === Build Info === */
        .build-info {
            font-size: 10px;
            color: #444;
            font-family: Monaco, Menlo, monospace;
        }

        /* === Debug Panel === */
        #debugPanel {
            margin-top: 15px;
            padding: 10px;
            background: var(--bg);
            border-radius: 8px;
            font-size: 11px;
            max-height: 120px;
            overflow-y: auto;
        }

        #debugLog { color: #ff6600; }

        /* === Responsive === */
        @media (max-width: 768px) {
            .message { max-width: 95%; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="status-dot" id="statusDot"></span>
            <h1>Claude Forward</h1>
            <span class="status-text" id="statusText">未连接</span>
        </div>
        <div class="header-actions" id="headerActions" style="display:none;">
            <button class="btn-icon" onclick="newSession()">新会话</button>
            <button class="btn-icon danger" onclick="detach()">断开</button>
        </div>
    </div>

    <!-- Connection View -->
    <div id="connectionView" class="view active">
        <div class="form-group">
            <label>服务器地址</label>
            <input type="text" id="serverUrl" placeholder="wss://your-server:6022">
        </div>
        <div class="form-group">
            <label>Token</label>
            <input type="password" id="token" placeholder="your-secret-token">
        </div>
        <button class="btn-primary" onclick="connect()">连接</button>
        <div id="debugPanel">
            <div style="color:#888;margin-bottom:5px;">调试日志:</div>
            <div id="debugLog"></div>
        </div>
        <div class="build-info" id="buildInfo">__BUILD_INFO__</div>
    </div>

    <!-- Client List View -->
    <div id="clientListView" class="view">
        <div style="padding:16px;">
            <h2 style="font-size:14px;color:var(--muted);margin-bottom:12px;">可用客户端</h2>
            <div id="clients"></div>
        </div>
    </div>

    <!-- Chat View -->
    <div id="chatView" class="view">
        <div class="messages-container" id="messagesContainer">
            <div class="empty-state" id="chatEmpty">
                <p style="font-size:16px;">已连接，发送消息开始对话</p>
            </div>
        </div>
        <div class="input-bar">
            <textarea id="chatInput" rows="1" placeholder="输入消息..." onkeydown="handleInputKey(event)"></textarea>
            <button class="btn-send" id="sendBtn" onclick="sendChatMessage()">&#9654;</button>
        </div>
    </div>

    <script>
        // === State ===
        let ws = null;
        let attachedClient = null;
        let isReconnecting = false;
        let isStreaming = false;
        let currentStreamEl = null;
        let currentStreamText = '';
        let currentToolCalls = {};
        let messageCount = 0;

        // === Init ===
        function init() {
            const params = new URLSearchParams(window.location.search);
            const server = params.get('server') || localStorage.getItem('cf_server') || '';
            const token = params.get('token') || localStorage.getItem('cf_token') || '';
            if (server) document.getElementById('serverUrl').value = server;
            if (token) document.getElementById('token').value = token;

            // Auto-resize textarea
            const textarea = document.getElementById('chatInput');
            textarea.addEventListener('input', () => {
                textarea.style.height = 'auto';
                textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
            });
        }

        // === Connection ===
        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const token = document.getElementById('token').value;
            if (!serverUrl || !token) { alert('请填写服务器地址和 Token'); return; }

            localStorage.setItem('cf_server', serverUrl);
            localStorage.setItem('cf_token', token);
            updateStatus('connecting', '连接中...');

            const wsUrl = `${serverUrl}/ws?token=${token}`;
            showDebug('正在连接: ' + wsUrl.replace(token, '*'.repeat(token.length)));

            try { ws = new WebSocket(wsUrl); } catch(e) { showDebug('创建 WebSocket 失败: ' + e.message); return; }

            ws.onopen = () => {
                showDebug('WebSocket 已连接');
                updateStatus('connected', '已连接');

                const savedClient = localStorage.getItem('cf_attached_client');
                if (savedClient) {
                    showDebug('恢复 attach: ' + savedClient);
                    attachedClient = savedClient;
                    sendMessage({ type: 'attach', payload: { client_id: savedClient } });
                    isReconnecting = false;
                } else {
                    sendMessage({ type: 'list' });
                }
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };

            ws.onclose = () => {
                updateStatus('', '连接已断开');
                if (attachedClient) {
                    localStorage.setItem('cf_attached_client', attachedClient);
                    isReconnecting = true;
                    showDebug('保存 attach 状态，3s 后重连');
                    setTimeout(() => { if (isReconnecting) connect(); }, 3000);
                }
            };

            ws.onerror = () => {
                updateStatus('', '连接错误');
            };
        }

        // === Message Handling ===
        function handleMessage(msg) {
            switch (msg.type) {
                case 'list':
                    showView('clientListView');
                    showClients(msg.payload.clients);
                    break;
                case 'attached':
                    localStorage.setItem('cf_attached_client', attachedClient);
                    showView('chatView');
                    document.getElementById('headerActions').style.display = 'flex';
                    break;
                case 'detached':
                    attachedClient = null;
                    isReconnecting = false;
                    localStorage.removeItem('cf_attached_client');
                    document.getElementById('headerActions').style.display = 'none';
                    showView('clientListView');
                    sendMessage({ type: 'list' });
                    break;
                case 'chat_message':
                    handleChatMessage(msg.payload);
                    break;
                case 'chat_ready':
                    isStreaming = false;
                    currentStreamEl = null;
                    currentStreamText = '';
                    document.getElementById('sendBtn').disabled = false;
                    break;
                case 'chat_error':
                    isStreaming = false;
                    document.getElementById('sendBtn').disabled = false;
                    addSystemMessage('错误: ' + (msg.payload?.message || '未知错误'));
                    break;
                case 'error':
                    if (msg.payload?.message?.includes('not found')) {
                        localStorage.removeItem('cf_attached_client');
                        isReconnecting = false;
                    }
                    addSystemMessage('错误: ' + (msg.payload?.message || '未知错误'));
                    break;
            }
        }

        function handleChatMessage(payload) {
            const container = document.getElementById('messagesContainer');
            // Hide empty state
            const empty = document.getElementById('chatEmpty');
            if (empty) empty.style.display = 'none';

            switch (payload.event_type) {
                case 'stream_delta':
                    if (!currentStreamEl) {
                        // Start new streaming message
                        currentStreamEl = createMessageEl('assistant', '');
                        container.appendChild(currentStreamEl);
                        messageCount++;
                    }
                    currentStreamText += payload.text;
                    const bubble = currentStreamEl.querySelector('.bubble');
                    bubble.innerHTML = renderMarkdown(currentStreamText);
                    scrollToBottom();
                    break;

                case 'text':
                    if (currentStreamEl) {
                        // Finalize streaming
                        currentStreamText += payload.text;
                        currentStreamEl.querySelector('.bubble').innerHTML = renderMarkdown(currentStreamText);
                        currentStreamEl = null;
                        currentStreamText = '';
                    } else {
                        // Complete text message
                        const el = createMessageEl('assistant', payload.text);
                        container.appendChild(el);
                        messageCount++;
                    }
                    scrollToBottom();
                    break;

                case 'thinking':
                    const thinkEl = createMessageEl('thinking', payload.text || '思考中...');
                    container.appendChild(thinkEl);
                    scrollToBottom();
                    break;

                case 'tool_start':
                    isStreaming = true;
                    document.getElementById('sendBtn').disabled = true;
                    const toolCard = createToolCard(payload.tool_id, payload.tool_name, payload.tool_input);
                    container.appendChild(toolCard);
                    currentToolCalls[payload.tool_id] = toolCard;
                    scrollToBottom();
                    break;

                case 'tool_end':
                    if (currentStreamEl) {
                        currentStreamEl = null;
                        currentStreamText = '';
                    }
                    break;

                case 'result':
                    if (currentStreamEl) {
                        currentStreamEl.querySelector('.bubble').innerHTML = renderMarkdown(currentStreamText);
                        currentStreamEl = null;
                        currentStreamText = '';
                    }
                    if (payload.cost_usd > 0) {
                        addSystemMessage(`费用: $${payload.cost_usd.toFixed(4)}`);
                    }
                    scrollToBottom();
                    break;
            }
        }

        // === UI Helpers ===
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function showClients(clients) {
            const container = document.getElementById('clients');
            if (!clients || clients.length === 0) {
                container.innerHTML = '<div class="empty-state"><h2>没有可用的客户端</h2><p>请确保本地客户端已启动</p></div>';
                return;
            }
            container.innerHTML = clients.map(c => `
                <div class="client-item ${attachedClient === c.id ? 'active' : ''}" onclick="attach('${c.id}')">
                    <div class="client-name">${c.name || c.id}</div>
                    <div class="client-meta">PID: ${c.pid || '-'}</div>
                    <div class="client-path">${c.path || ''}</div>
                </div>
            `).join('');
        }

        function createMessageEl(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = role === 'assistant' || role === 'thinking' ? renderMarkdown(text) : escapeHtml(text);
            div.appendChild(bubble);
            return div;
        }

        function createToolCard(toolId, toolName, toolInput) {
            const card = document.createElement('div');
            card.className = 'tool-card';

            const args = formatToolArgs(toolName, toolInput);
            const id = 'tool-' + (toolId || Math.random().toString(36).substr(2, 6));

            card.innerHTML = `
                <div class="tool-header" onclick="toggleToolOutput('${id}')">
                    <span class="tool-icon">${getToolIcon(toolName)}</span>
                    <span class="tool-name">${escapeHtml(toolName || 'Tool')}</span>
                    <span class="tool-args">${escapeHtml(args)}</span>
                    <span class="tool-toggle" id="${id}-toggle">&#9654;</span>
                </div>
                <div class="tool-output" id="${id}">
                    <pre>${toolInput ? formatJSON(toolInput) : '执行中...'}</pre>
                </div>
            `;
            return card;
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            div.style.cssText = 'text-align:center;padding:8px;font-size:12px;color:var(--muted);';
            div.textContent = text;
            container.appendChild(div);
            scrollToBottom();
        }

        function renderMarkdown(text) {
            if (!text) return '';
            try {
                return marked.parse(text, { breaks: true });
            } catch(e) {
                return escapeHtml(text);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatToolArgs(toolName, input) {
            if (!input) return '';
            try {
                const obj = typeof input === 'string' ? JSON.parse(input) : input;
                switch(toolName) {
                    case 'Read': return obj.file_path || '';
                    case 'Edit': return obj.file_path || '';
                    case 'Write': return obj.file_path || '';
                    case 'Bash': return (obj.command || '').substring(0, 60);
                    case 'Glob': return obj.pattern || '';
                    case 'Grep': return obj.pattern || '';
                    default: return JSON.stringify(obj).substring(0, 60);
                }
            } catch(e) { return String(input).substring(0, 60); }
        }

        function getToolIcon(name) {
            const icons = {
                'Read': '&#128196;', 'Edit': '&#9997;', 'Write': '&#128190;',
                'Bash': '&#128187;', 'Glob': '&#128269;', 'Grep': '&#128270;',
            };
            return icons[name] || '&#128295;';
        }

        function formatJSON(input) {
            try {
                const obj = typeof input === 'string' ? JSON.parse(input) : input;
                return escapeHtml(JSON.stringify(obj, null, 2));
            } catch(e) { return escapeHtml(String(input)); }
        }

        function toggleToolOutput(id) {
            const output = document.getElementById(id);
            const toggle = document.getElementById(id + '-toggle');
            if (output && toggle) {
                output.classList.toggle('open');
                toggle.classList.toggle('open');
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        }

        // === Actions ===
        function attach(clientId) {
            attachedClient = clientId;
            sendMessage({ type: 'attach', payload: { client_id: clientId } });
        }

        function detach() {
            sendMessage({ type: 'detach' });
            attachedClient = null;
            isReconnecting = false;
            localStorage.removeItem('cf_attached_client');
            document.getElementById('headerActions').style.display = 'none';
            // Clear chat
            document.getElementById('messagesContainer').innerHTML = '<div class="empty-state" id="chatEmpty"><p style="font-size:16px;">已连接，发送消息开始对话</p></div>';
            messageCount = 0;
            currentStreamEl = null;
            currentStreamText = '';
            currentToolCalls = {};
        }

        function newSession() {
            sendMessage({ type: 'new_session' });
            document.getElementById('messagesContainer').innerHTML = '<div class="empty-state" id="chatEmpty"><p style="font-size:16px;">新会话已开始</p></div>';
            messageCount = 0;
            currentStreamEl = null;
            currentStreamText = '';
            currentToolCalls = {};
            isStreaming = false;
            document.getElementById('sendBtn').disabled = false;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || isStreaming) return;

            // Add user message to chat
            const container = document.getElementById('messagesContainer');
            const empty = document.getElementById('chatEmpty');
            if (empty) empty.style.display = 'none';

            const userEl = createMessageEl('user', text);
            container.appendChild(userEl);
            scrollToBottom();

            // Send to server
            sendMessage({ type: 'chat_input', payload: { text: text } });

            // Clear input
            input.value = '';
            input.style.height = 'auto';

            // Disable send while processing
            isStreaming = true;
            document.getElementById('sendBtn').disabled = true;
        }

        function handleInputKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        }

        function sendMessage(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(msg));
            }
        }

        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            dot.className = 'status-dot';
            if (status) dot.classList.add(status);
            statusText.textContent = text;
        }

        function showDebug(msg) {
            const el = document.getElementById('debugLog');
            if (el) {
                const time = new Date().toLocaleTimeString();
                el.innerHTML = `<div>[${time}] ${msg}</div>` + el.innerHTML;
            }
        }

        // === Start ===
        init();
    </script>
</body>
</html>
